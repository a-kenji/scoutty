name: "ci"
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
  merge_group:
jobs:
  formatting:
    runs-on: ubuntu-latest
    environment: CACHIX
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: nixos/nix-installer-action@06919331f77d29cd5254bbc9df033ea07232d89a
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kenji
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          diagnostic-endpoint: ""
      - name: "check formatting"
        run: nix build .#checks.x86_64-linux.treefmt -Lvv --no-update-lock-file
  scoutty:
    runs-on: ${{ matrix.os }}
    environment: CACHIX
    needs: ['formatting']
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: nixos/nix-installer-action@06919331f77d29cd5254bbc9df033ea07232d89a
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kenji
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          diagnostic-endpoint: ""
      - name: "build scoutty"
        run: nix build .#checks.${{ matrix.system }}.scoutty -Lvv --no-update-lock-file
      - name: "package artifact"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          artifact_name="scoutty-${tag}-${{ matrix.system }}"
          mkdir -p "${artifact_name}"
          cp result/bin/scoutty "${artifact_name}/"
          tar czf "${artifact_name}.tar.gz" "${artifact_name}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: scoutty-${{ matrix.system }}
          path: scoutty-*.tar.gz
  devshells:
    runs-on: ${{ matrix.os }}
    environment: CACHIX
    needs: ['formatting']
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: nixos/nix-installer-action@06919331f77d29cd5254bbc9df033ea07232d89a
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kenji
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          diagnostic-endpoint: ""
      - name: "build devshells"
        run: nix build .#devShells.${{ matrix.system }}.default -Lvv --no-update-lock-file
  all:
    name: All checks passed
    if: always()
    runs-on: ubuntu-latest
    needs: ['formatting', 'scoutty', 'devshells']
    steps:
      - name: "verify all jobs passed"
        run: |
          if [[ "${{ needs.formatting.result }}" != "success" ]] || \
             [[ "${{ needs.scoutty.result }}" != "success" ]] || \
             [[ "${{ needs.devshells.result }}" != "success" ]]; then
            echo "Some checks failed"
            exit 1
          fi
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: ['scoutty']
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - name: "generate checksums"
        run: sha256sum scoutty-*.tar.gz > sha256sums.txt
      - name: "upload release artifacts"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release upload "${tag}" \
            scoutty-*.tar.gz \
            sha256sums.txt
