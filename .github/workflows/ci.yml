name: "ci"
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
  merge_group:
jobs:
  formatting:
    runs-on: ubuntu-latest
    environment: CACHIX
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: nixos/nix-installer-action@06919331f77d29cd5254bbc9df033ea07232d89a
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: kenji
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          diagnostic-endpoint: ""
      - name: "check formatting"
        run: nix build .#checks.x86_64-linux.treefmt -Lvv --no-update-lock-file
  scoutty:
    runs-on: ${{ matrix.os }}
    environment: CACHIX
    needs: ['formatting']
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: nixos/nix-installer-action@06919331f77d29cd5254bbc9df033ea07232d89a
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: kenji
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          diagnostic-endpoint: ""
      - name: "build scoutty"
        run: nix build .#checks.${{ matrix.system }}.scoutty -Lvv --no-update-lock-file
      - name: "package artifact"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          artifact_name="scoutty-${tag}-${{ matrix.system }}"
          mkdir -p "${artifact_name}"
          cp result/bin/scoutty "${artifact_name}/"
          tar czf "${artifact_name}.tar.gz" "${artifact_name}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: scoutty-${{ matrix.system }}
          path: scoutty-*.tar.gz
  devshells:
    runs-on: ${{ matrix.os }}
    environment: CACHIX
    needs: ['formatting']
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: nixos/nix-installer-action@06919331f77d29cd5254bbc9df033ea07232d89a
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: kenji
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          diagnostic-endpoint: ""
      - name: "build devshells"
        run: nix build .#devShells.${{ matrix.system }}.default -Lvv --no-update-lock-file
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: ['scoutty']
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - name: "generate checksums"
        run: sha256sum scoutty-*.tar.gz > sha256sums.txt
      - name: "create release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "${tag}" \
            --draft \
            --generate-notes \
            scoutty-*.tar.gz \
            sha256sums.txt
